<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CompliVibe — AI Trust Infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f4f7ff"/>
      <stop offset="100%" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="aurora" cx="82%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="10%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#brand)"/>

  <!-- Logo mark -->
  <g transform="translate(96,86)">
    <rect width="64" height="64" rx="16" fill="url(#brand)"/>
    <text x="32" y="43" font-family="Geist, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">CV</text>
    <text x="84" y="42" font-family="Geist, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1220">CompliVibe</text>
  </g>

  <!-- Headline -->
  <text x="96" y="320" font-family="Geist, Inter, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#0b1220">AI Trust Infrastructure</text>
  <text x="96" y="404" font-family="Geist, Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#475569">One operating layer to govern AI, automate evidence,</text>
  <text x="96" y="450" font-family="Geist, Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#475569">monitor risk, and publish trust.</text>

  <!-- Pillars -->
  <g font-family="Geist, Inter, Arial, sans-serif" font-size="24" font-weight="600">
    <g transform="translate(96,520)">
      <rect width="232" height="56" rx="28" fill="#ffffff" stroke="#dbe3f4"/>
      <circle cx="34" cy="28" r="6" fill="#2563eb"/>
      <text x="56" y="36" fill="#0b1220">Governance</text>
    </g>
    <g transform="translate(348,520)">
      <rect width="232" height="56" rx="28" fill="#ffffff" stroke="#dbe3f4"/>
      <circle cx="34" cy="28" r="6" fill="#7c3aed"/>
      <text x="56" y="36" fill="#0b1220">Compliance</text>
    </g>
    <g transform="translate(600,520)">
      <rect width="252" height="56" rx="28" fill="#ffffff" stroke="#dbe3f4"/>
      <circle cx="34" cy="28" r="6" fill="#10b981"/>
      <text x="56" y="36" fill="#0b1220">Observability</text>
    </g>
  </g>

  <text x="1104" y="600" font-family="Geist, Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#64748b" text-anchor="end">complivibe.in</text>
</svg>
