# /etc/nginx/sites-available/complivibe.in
#
# Serves the Next.js static export from disk and proxies the only two paths
# that are not static: the CMS API and the uploaded cover images.
#
# This is the PRE-TLS version. Install it, verify the site over plain HTTP,
# then run:
#
#   sudo certbot --nginx -d complivibe.in -d www.complivibe.in
#
# certbot rewrites this file in place — it adds the `listen 443 ssl` lines,
# the certificate paths, and a new port-80 server block that redirects to
# HTTPS. Every location block below survives that edit untouched.

server {
    listen 80;
    listen [::]:80;
    server_name complivibe.in www.complivibe.in;

    root /srv/complivibe/frontend/current;
    index index.html;

    access_log /var/log/nginx/complivibe.access.log;
    error_log  /var/log/nginx/complivibe.error.log;

    # The CMS caps uploads at UPLOAD_MAX_BYTES (5 MB by default). nginx's own
    # 1 MB default would reject a valid cover image with a 413 before the
    # request ever reached it.
    client_max_body_size 10m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    # NOTE ON add_header INHERITANCE
    # nginx inherits add_header from an outer level ONLY if the inner level
    # defines no add_header of its own. Any location below that adds a header
    # therefore repeats these four rather than inheriting them. That is why
    # they look duplicated — removing the copies silently drops the headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Serve the styled 404 page with a real 404 status.
    #
    # The obvious spelling — `try_files ... /404.html` — serves that page with
    # a 200, which is a soft 404: search engines index the error page as a
    # real one. Falling through to `=404` and letting error_page pick it up
    # keeps the status code correct. error_page without an `=` argument
    # preserves the original code.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # -----------------------------------------------------------------------
    # Framework alias redirects
    #
    # The export ships /frameworks/iso27001 and /frameworks/iso-27001 as two
    # real pages with identical content — a duplicate the static export has no
    # way to collapse on its own, since both are generated routes. nginx can.
    #
    # Exact-match (`=`) locations are evaluated before prefix and regex
    # locations, so these are reached ahead of the `location /` fallback that
    # would otherwise happily serve the alias file.
    # -----------------------------------------------------------------------
    location = /frameworks/iso27001       { return 301 /frameworks/iso-27001; }
    location = /frameworks/iso9001        { return 301 /frameworks/iso-9001; }
    location = /frameworks/iso27017       { return 301 /frameworks/iso-27017; }
    location = /frameworks/iso27001.html  { return 301 /frameworks/iso-27001; }
    location = /frameworks/iso9001.html   { return 301 /frameworks/iso-9001; }
    location = /frameworks/iso27017.html  { return 301 /frameworks/iso-27017; }

    # -----------------------------------------------------------------------
    # Canonical URL shape
    #
    # next.config.ts sets trailingSlash: false and every canonical tag points
    # at the extensionless form, but the .html files are still sitting on disk
    # and directly reachable. Redirect them so only one URL per page can be
    # crawled. `= /404.html` above is an exact match and so is evaluated
    # before these regexes — the internal error-page redirect is not caught.
    # -----------------------------------------------------------------------
    location = /index.html   { return 301 /; }
    location ~ ^(/.+)\.html$ { return 301 $1; }
    location ~ ^(/.+)/$      { return 301 $1; }

    # The homepage is served explicitly, and this is not cosmetic.
    #
    # Leaving `/` to the `location /` fallback below means try_files reaches
    # its `$uri/` entry, which hands off to nginx's index module. That does an
    # INTERNAL REDIRECT to /index.html, which re-enters location matching, hits
    # the `= /index.html` rule above and 301s back to `/` — an infinite
    # redirect loop on the homepage, and only on the homepage. Naming the file
    # directly means try_files serves it without a second location lookup.
    location = / {
        try_files /index.html =404;
    }

    # -----------------------------------------------------------------------
    # CMS API. Port 4000 is loopback-only and has no security group rule —
    # this proxy is the only route to it from the internet.
    # -----------------------------------------------------------------------
    location ^~ /cms-api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -----------------------------------------------------------------------
    # Uploaded cover images.
    #
    # Public static files at /uploads/*, deliberately not behind /cms-api —
    # serving them from the site's own origin is what lets the frontend store
    # and render them as plain relative URLs.
    #
    # Filenames are content-addressed and never rewritten, so a long cache is
    # safe. proxy_cache_valid alone does nothing without a cache zone; the
    # zone is declared in conf.d/complivibe-cache.conf.
    #
    # The CMS sends its own CSP and nosniff headers on these responses (an
    # uploaded SVG can carry script, and these sit on the site's origin).
    # Those are passed through — nothing here strips them.
    # -----------------------------------------------------------------------
    location ^~ /uploads/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache        complivibe_uploads;
        proxy_cache_valid  200 30d;
        add_header         X-Cache-Status $upstream_cache_status;

        # Repeated, not inherited — see the note at the top of this block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # -----------------------------------------------------------------------
    # Admin panel and login.
    #
    # /admin already ships a noindex meta tag and is excluded from the
    # sitemap; the response header is a third layer that does not depend on a
    # crawler executing or parsing the page.
    # -----------------------------------------------------------------------
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html =404;
    }

    location /login {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html =404;
    }

    # Build assets are hashed, so the URL changes whenever the bytes do.
    location ^~ /_next/static/ {
        expires 1y;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Everything else: the static export.
    #
    # $uri.html is what replaces Azure Static Web Apps' implicit extensionless
    # routing — /about on the wire, about.html on disk. Without it every page
    # but the homepage 404s.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri.html =404;
    }
}
