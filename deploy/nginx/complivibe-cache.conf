# /etc/nginx/conf.d/complivibe-cache.conf
#
# Cache zone for proxied uploads. proxy_cache_path is only valid in the http
# context, which is why this cannot live in the site file next to the
# `location /uploads/` block that uses it.
#
# 10m of keys holds roughly 80k cached objects; max_size caps the bytes on
# disk. Uploads are capped at 5 MB each and cover images are the only thing
# stored, so 1g is far more headroom than this site will use.

proxy_cache_path /var/cache/nginx/complivibe
                 levels=1:2
                 keys_zone=complivibe_uploads:10m
                 max_size=1g
                 inactive=30d
                 use_temp_path=off;
